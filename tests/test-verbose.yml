name: Test verbose mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: ./
          format: sarif
          output: aguara-verbose.sarif
          severity: info
          verbose: 'true'
          upload-sarif: 'false'
          install-script-ref: v0.27.0
        continue-on-error: true

      - name: Assert SARIF output file exists
        run: |
          if [ ! -f "aguara-verbose.sarif" ]; then
            echo "FAIL: expected SARIF output file 'aguara-verbose.sarif' not found"
            exit 1
          fi
          echo "PASS: SARIF output file exists"

      - name: Assert exit-code output is set
        env:
          ACTUAL: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "actual exit-code: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          echo "PASS: exit-code output is set to '$ACTUAL'"

      - name: Assert findings-count output is numeric
        env:
          ACTUAL: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "actual findings-count: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$ACTUAL' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count is a valid number: $ACTUAL"
