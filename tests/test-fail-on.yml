name: Test fail-on behavior
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Scan with fail-on=critical — if no critical findings, exit code should be 0
      # If there ARE critical findings, exit code will be non-zero but that's valid behavior
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: ./
          format: sarif
          output: aguara-failon.sarif
          severity: info
          fail-on: critical
          upload-sarif: 'false'

      - name: Assert exit-code output reflects scan result
        env:
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS_COUNT"
          echo "exit-code: $EXIT_CODE"

          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi

          # exit-code must be set
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          echo "PASS: exit-code output is set to '$EXIT_CODE'"

          # findings-count must be a number
          if ! echo "$FINDINGS_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS_COUNT' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS_COUNT'"

          # The action outcome must match the exit code:
          # exit-code=0 → action should succeed; exit-code!=0 → action should fail
          if [ "$EXIT_CODE" = "0" ] && [ "$OUTCOME" != "success" ]; then
            echo "FAIL: exit-code is 0 but action outcome is '$OUTCOME' (expected success)"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: exit-code is '$EXIT_CODE' but action outcome is '$OUTCOME' (expected failure)"
            exit 1
          fi
          echo "PASS: outcome '$OUTCOME' is consistent with exit-code '$EXIT_CODE'"
