name: Test fail-on severity behavior
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl (with findings)
        run: |
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl-findings.sh" /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: ./
          severity: info
          fail-on: critical
          format: sarif
          output: aguara-results.sarif
          upload-sarif: 'false'

      - name: Assert action failed due to fail-on and findings-count is 1
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to fail-on=critical, got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: expected exit-code=1, got '$EXIT_CODE'"
            exit 1
          fi
          if [ "$FINDINGS" != "1" ]; then
            echo "FAIL: expected findings-count=1, got '$FINDINGS'"
            exit 1
          fi
          echo "PASS: action correctly failed with findings"
