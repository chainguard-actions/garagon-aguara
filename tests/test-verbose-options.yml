name: Test verbose and disable-rule options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: ./
          severity: high
          format: sarif
          output: aguara-verbose-results.sarif
          verbose: 'true'
          upload-sarif: 'false'
          install-script-ref: v0.22.0
        continue-on-error: true

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          echo "PASS: exit-code is '$EXIT_CODE'"

      - name: Assert findings-count output is set
        env:
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS_COUNT"
          if [ -z "$FINDINGS_COUNT" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS_COUNT'"

      - name: Assert SARIF output file exists
        run: |
          if [ ! -f "aguara-verbose-results.sarif" ]; then
            echo "FAIL: expected SARIF output file 'aguara-verbose-results.sarif' not found"
            exit 1
          fi
          echo "PASS: SARIF output file exists"
