name: Test disable-rule option
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory to scan
        run: |
          mkdir -p /tmp/disable-rule-target
          echo "# Test file" > /tmp/disable-rule-target/README.md

      - id: action
        uses: .
        with:
          path: /tmp/disable-rule-target
          severity: info
          format: sarif
          output: aguara-disable-rule.sarif
          disable-rule: 'PROMPT_INJECTION_001,DATA_EXFIL_001'
          upload-sarif: 'false'
          install-script-ref: v0.24.0
        continue-on-error: true

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          echo "PASS: exit-code is '$EXIT_CODE'"

      - name: Assert findings-count output is set and numeric
        env:
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS_COUNT"
          if [ -z "$FINDINGS_COUNT" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          if ! echo "$FINDINGS_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS_COUNT' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS_COUNT'"

      - name: Assert SARIF output file exists
        run: |
          if [ ! -f "aguara-disable-rule.sarif" ]; then
            echo "FAIL: aguara-disable-rule.sarif was not created"
            exit 1
          fi
          echo "PASS: aguara-disable-rule.sarif exists"
