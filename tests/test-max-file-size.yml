name: Test max-file-size input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: ./
          severity: info
          format: sarif
          output: aguara-maxsize.sarif
          max-file-size: '10MB'
          upload-sarif: 'false'
          install-script-ref: v0.22.1

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          echo "PASS: exit-code is '$EXIT_CODE'"

      - name: Assert findings-count output is set
        env:
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS_COUNT"
          if [ -z "$FINDINGS_COUNT" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          if ! echo "$FINDINGS_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS_COUNT' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS_COUNT'"

      - name: Assert SARIF output file was created
        run: |
          if [ ! -f "aguara-maxsize.sarif" ]; then
            echo "FAIL: aguara-maxsize.sarif was not created"
            exit 1
          fi
          echo "PASS: aguara-maxsize.sarif exists"
          if ! jq '.runs' aguara-maxsize.sarif > /dev/null 2>&1; then
            echo "FAIL: aguara-maxsize.sarif is not valid SARIF JSON"
            exit 1
          fi
          echo "PASS: aguara-maxsize.sarif is valid SARIF"
