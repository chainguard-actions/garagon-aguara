name: Test basic usage - default SARIF scan with no findings
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl to intercept install.sh download
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-install.sh" /tmp/fake-install-aguara.sh
          chmod +x /tmp/fake-install-aguara.sh

          mkdir -p /tmp/fake-bin
          printf '%s\n' '#!/bin/sh' \
            'out=""' \
            'prev=""' \
            'for arg in "$@"; do' \
            '  case "$prev" in' \
            '    -o|--output) out="$arg" ;;' \
            '  esac' \
            '  prev="$arg"' \
            'done' \
            'case "$*" in' \
            '  *garagon/aguara*install.sh*)' \
            '    if [ -n "$out" ]; then' \
            '      cat /tmp/fake-install-aguara.sh > "$out"' \
            '    else' \
            '      cat /tmp/fake-install-aguara.sh' \
            '    fi' \
            '    exit 0' \
            '    ;;' \
            'esac' \
            'exec /usr/bin/curl "$@"' \
            > /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          path: ./
          severity: info
          format: sarif
          output: aguara-results.sarif
          upload-sarif: 'false'
          install-script-ref: v0.22.2

      - name: Assert findings-count output is numeric
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a number: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          echo "PASS: exit-code=$EXIT_CODE"

      - name: Assert SARIF output file was created
        run: |
          if [ ! -f "aguara-results.sarif" ]; then
            echo "FAIL: aguara-results.sarif was not created"
            exit 1
          fi
          echo "PASS: SARIF file exists"
          cat aguara-results.sarif

      - name: Assert SARIF file is valid JSON
        run: |
          if ! jq . aguara-results.sarif > /dev/null 2>&1; then
            echo "FAIL: aguara-results.sarif is not valid JSON"
            exit 1
          fi
          echo "PASS: SARIF file is valid JSON"
