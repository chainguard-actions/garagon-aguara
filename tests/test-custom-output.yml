name: Test custom output path and max-file-size option
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl to intercept install.sh download
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-install.sh" /tmp/fake-install-aguara.sh
          chmod +x /tmp/fake-install-aguara.sh

          mkdir -p /tmp/fake-bin
          printf '%s\n' '#!/bin/sh' \
            'out=""' \
            'prev=""' \
            'for arg in "$@"; do' \
            '  case "$prev" in' \
            '    -o|--output) out="$arg" ;;' \
            '  esac' \
            '  prev="$arg"' \
            'done' \
            'case "$*" in' \
            '  *garagon/aguara*install.sh*)' \
            '    if [ -n "$out" ]; then' \
            '      cat /tmp/fake-install-aguara.sh > "$out"' \
            '    else' \
            '      cat /tmp/fake-install-aguara.sh' \
            '    fi' \
            '    exit 0' \
            '    ;;' \
            'esac' \
            'exec /usr/bin/curl "$@"' \
            > /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          path: ./
          severity: medium
          format: sarif
          output: custom-scan-output.sarif
          max-file-size: 50MB
          upload-sarif: 'false'
          install-script-ref: v0.22.2

      - name: Assert action completed successfully
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: action completed with exit-code=0"

      - name: Assert custom output file was created at specified path
        run: |
          if [ ! -f "custom-scan-output.sarif" ]; then
            echo "FAIL: custom-scan-output.sarif was not created at the specified path"
            exit 1
          fi
          echo "PASS: custom output file exists at custom-scan-output.sarif"

      - name: Assert default output file was NOT created
        run: |
          if [ -f "aguara-results.sarif" ]; then
            echo "FAIL: default aguara-results.sarif was created when a custom output was specified"
            exit 1
          fi
          echo "PASS: default output file was not created (custom path was used)"

      - name: Assert findings-count output is numeric
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a number: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"
