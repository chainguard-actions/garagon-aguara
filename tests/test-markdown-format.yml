name: Test markdown output format
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: ./
          format: markdown
          output: aguara-results.md
          severity: info
          upload-sarif: 'false'

      - name: Assert action ran and outputs are set
        env:
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $FINDINGS_COUNT"
          echo "exit-code: $EXIT_CODE"

          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi

          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output is empty"
            exit 1
          fi
          echo "PASS: exit-code is '$EXIT_CODE'"

          # For markdown format, findings-count may be 0 (not extracted from markdown)
          # but the output key must still be set
          if [ -z "$FINDINGS_COUNT" ]; then
            echo "FAIL: findings-count output is not set"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS_COUNT'"

      - name: Assert markdown output file exists
        run: |
          if [ ! -f "aguara-results.md" ]; then
            echo "FAIL: markdown output file not found"
            exit 1
          fi
          echo "PASS: markdown output file exists"
          # Markdown file should have some content
          if [ ! -s "aguara-results.md" ]; then
            echo "INFO: markdown output file is empty (no findings)"
          else
            echo "PASS: markdown output file has content"
          fi
