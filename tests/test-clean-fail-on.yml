name: Test clean fixture passes with fail-on high
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/clean
          severity: high
          fail-on: high
          format: json
          output: clean-results.json
          upload-sarif: 'false'
      - name: Assert clean scan
        env:
          COUNT: ${{ steps.action.outputs.findings-count }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "findings-count: $COUNT"
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code 0"
            exit 1
          fi
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: expected 0 findings"
            exit 1
          fi
          if [ ! -f clean-results.json ]; then
            echo "FAIL: clean-results.json not found"
            exit 1
          fi
          echo "PASS"
