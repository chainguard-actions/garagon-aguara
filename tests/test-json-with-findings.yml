name: Test JSON format with findings present
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl and fake install.sh (with findings)
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-install-with-findings.sh" /tmp/fake-install.sh
          chmod +x /tmp/fake-install.sh

          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl.sh" /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl

          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          path: ./
          format: json
          output: aguara-results.json
          # No fail-on set, so action should exit 0 even with findings
          upload-sarif: 'false'
          install-script-ref: v0.23.0

      - name: Assert exit-code is 0 (no fail-on set)
        env:
          ACTUAL: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "actual exit-code: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected exit-code=0 when fail-on is not set, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert findings-count is non-zero
        env:
          ACTUAL: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "actual findings-count: $ACTUAL"
          if [ "$ACTUAL" = "0" ] || [ -z "$ACTUAL" ]; then
            echo "FAIL: expected findings-count > 0, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: findings-count=$ACTUAL"

      - name: Assert JSON output file exists and has findings
        run: |
          if [ ! -f "aguara-results.json" ]; then
            echo "FAIL: expected aguara-results.json to exist"
            exit 1
          fi
          echo "PASS: JSON file exists"
          cat aguara-results.json
          count=$(jq '.findings | length' aguara-results.json 2>/dev/null || echo 0)
          echo "findings in JSON: $count"
          if [ "$count" = "0" ]; then
            echo "FAIL: expected findings in JSON output"
            exit 1
          fi
          echo "PASS: JSON has findings"
