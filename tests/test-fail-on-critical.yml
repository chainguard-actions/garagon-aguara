name: Test fail-on critical severity
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: ./
          severity: info
          fail-on: critical
          format: sarif
          output: aguara-results.sarif
          upload-sarif: 'false'
          install-script-ref: v0.22.2
        continue-on-error: true

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          echo "PASS: exit-code is '$EXIT_CODE'"

      - name: Assert findings-count output is set
        env:
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS_COUNT"
          if [ -z "$FINDINGS_COUNT" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS_COUNT'"

      - name: Assert exit-code is 0 when no critical findings
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "INFO: exit-code is '$EXIT_CODE' (non-zero may mean critical findings were found or scan error)"
          else
            echo "PASS: exit-code is 0 (no critical findings)"
          fi
