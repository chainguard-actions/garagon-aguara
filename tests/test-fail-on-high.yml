name: Test fail-on high with malicious fixture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/malicious
          format: json
          output: aguara-results.json
          fail-on: high
          upload-sarif: 'false'
      - name: Assert action failed due to findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COUNT: ${{ steps.action.outputs.findings-count }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "findings-count: $COUNT"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail with fail-on high"
            exit 1
          fi
          if [ -z "$EXIT_CODE" ] || [ "$EXIT_CODE" = "0" ]; then
            echo "FAIL: expected non-zero exit-code"
            exit 1
          fi
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]] || [ "$COUNT" -lt 1 ]; then
            echo "FAIL: expected at least one finding"
            exit 1
          fi
          echo "PASS"
