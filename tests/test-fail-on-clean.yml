name: Test fail-on with clean scan target
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a benign test file to scan
        run: |
          mkdir -p /tmp/clean-scan-target
          cat > /tmp/clean-scan-target/README.md << 'EOF'
          # Clean Test Target
          This is a benign markdown file with no security issues.
          It contains no prompt injection, no data exfiltration patterns,
          and no tool shadowing.
          EOF

      - id: action
        uses: .
        with:
          path: /tmp/clean-scan-target
          severity: info
          fail-on: critical
          format: sarif
          output: aguara-failon-results.sarif
          upload-sarif: 'false'
          install-script-ref: v0.27.0

      - name: Assert action succeeded (exit-code 0 for clean scan with fail-on critical)
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code 0 for clean scan with fail-on=critical, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit-code is 0 as expected for clean scan"

      - name: Assert findings-count is a valid integer
        env:
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS_COUNT"
          if ! echo "$FINDINGS_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS_COUNT' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS_COUNT'"
