name: Test fail-on severity threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a clean directory with no AI agent files to scan
      - name: Create clean scan target
        run: |
          mkdir -p /tmp/clean-target
          echo "# Simple README" > /tmp/clean-target/README.md

      - id: action
        uses: .
        with:
          path: /tmp/clean-target
          severity: info
          fail-on: critical
          format: sarif
          output: aguara-fail-on-results.sarif
          upload-sarif: 'false'
          install-script-ref: v0.22.0
        continue-on-error: true

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          echo "PASS: exit-code is '$EXIT_CODE'"

      - name: Assert findings-count output is set
        env:
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS_COUNT"
          if [ -z "$FINDINGS_COUNT" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS_COUNT'"

      - name: Assert no critical findings in clean directory
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code from scan of clean directory: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit code 0 for clean directory with fail-on=critical, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: clean directory scan returned exit code 0"
