name: Test fail-on severity option
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean directory to scan (no findings expected)
        run: |
          mkdir -p /tmp/clean-scan-target
          echo "# Hello World" > /tmp/clean-scan-target/README.md
          echo "def greet(name):" > /tmp/clean-scan-target/hello.py
          echo "    return f'Hello, {name}!'" >> /tmp/clean-scan-target/hello.py

      - id: action
        uses: .
        with:
          path: /tmp/clean-scan-target
          severity: critical
          fail-on: critical
          format: sarif
          output: aguara-results.sarif
          upload-sarif: 'false'
          install-script-ref: v0.24.0

      - name: Assert exit-code is 0 (no critical findings in clean target)
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code 0 for clean scan with fail-on=critical, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS: exit-code is 0 as expected"

      - name: Assert findings-count is 0 for clean target
        env:
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS_COUNT"
          if [ "$FINDINGS_COUNT" != "0" ]; then
            echo "WARN: expected 0 findings in clean target, got '$FINDINGS_COUNT' (may be acceptable)"
          else
            echo "PASS: findings-count is 0 as expected"
          fi
