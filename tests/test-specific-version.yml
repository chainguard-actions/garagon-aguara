name: Test specific version installation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: ./
          version: v0.27.0
          format: sarif
          output: aguara-version-results.sarif
          upload-sarif: 'false'
          install-script-ref: v0.27.0
        continue-on-error: true

      - name: Assert exit-code output is set
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit-code output was not set"
            exit 1
          fi
          echo "PASS: exit-code is '$EXIT_CODE'"

      - name: Assert findings-count output is set
        env:
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS_COUNT"
          if [ -z "$FINDINGS_COUNT" ]; then
            echo "FAIL: findings-count output was not set"
            exit 1
          fi
          if ! echo "$FINDINGS_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count '$FINDINGS_COUNT' is not a non-negative integer"
            exit 1
          fi
          echo "PASS: findings-count is '$FINDINGS_COUNT'"

      - name: Assert SARIF output file was created
        run: |
          if [ ! -f "aguara-version-results.sarif" ]; then
            echo "FAIL: SARIF output file was not created"
            exit 1
          fi
          echo "PASS: SARIF output file exists"

      - name: Assert correct version was installed
        run: |
          # Verify aguara is installed and reports the expected version
          INSTALLED_VERSION=$(aguara version 2>/dev/null || echo "unknown")
          echo "Installed version: $INSTALLED_VERSION"
          if echo "$INSTALLED_VERSION" | grep -q "0.27.0"; then
            echo "PASS: correct version v0.27.0 is installed"
          else
            echo "FAIL: expected version 0.27.0 but got '$INSTALLED_VERSION'"
            exit 1
          fi
