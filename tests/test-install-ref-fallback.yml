name: Test install-script-ref fallback for invalid refs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl to intercept install.sh download
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-install.sh" /tmp/fake-install-aguara.sh
          chmod +x /tmp/fake-install-aguara.sh

          mkdir -p /tmp/fake-bin
          printf '%s\n' '#!/bin/sh' \
            'out=""' \
            'prev=""' \
            'for arg in "$@"; do' \
            '  case "$prev" in' \
            '    -o|--output) out="$arg" ;;' \
            '  esac' \
            '  prev="$arg"' \
            'done' \
            'case "$*" in' \
            '  *garagon/aguara*install.sh*)' \
            '    if [ -n "$out" ]; then' \
            '      cat /tmp/fake-install-aguara.sh > "$out"' \
            '    else' \
            '      cat /tmp/fake-install-aguara.sh' \
            '    fi' \
            '    exit 0' \
            '    ;;' \
            'esac' \
            'exec /usr/bin/curl "$@"' \
            > /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      # Pass an invalid ref (a branch name) — the action should warn and fall back to default
      - id: action
        uses: .
        with:
          path: ./
          severity: info
          format: sarif
          output: aguara-results.sarif
          upload-sarif: 'false'
          install-script-ref: main

      - name: Assert action completed successfully despite invalid ref
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "exit-code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit-code=0 after ref fallback, got $EXIT_CODE"
            exit 1
          fi
          echo "PASS: action completed with exit-code=0 after falling back from invalid ref"

      - name: Assert findings-count is set
        env:
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "findings-count: $FINDINGS"
          if ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: findings-count is not a number: '$FINDINGS'"
            exit 1
          fi
          echo "PASS: findings-count=$FINDINGS"
