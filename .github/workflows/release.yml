name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update v1 action tag
        if: success() && startsWith(github.ref_name, 'v1')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa v1 -m "v1 action alias → $REF_NAME"
          git push origin v1 --force

      - name: Trigger observatory rescan
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.OBSERVATORY_DISPATCH_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh api repos/garagon/aguara-observatory/dispatches \
            -f event_type=aguara-release \
            -f "client_payload[tag]=$REF_NAME"
